<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JUEGA O MUERE</title>
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Nosifer&display=swap" rel="stylesheet"> <!-- Fuente similar al estilo viscoso -->
    <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Nosifer&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Rubik+Wet+Paint&display=swap" rel="stylesheet">
    <link rel="icon" href="fantasma.png" type="image/png">
</head>
<body>
    <div class="container">
        <div class="content">
            <h1 class="goosebumps-text-1">JUEGA O MUERE</h1>
            <p class="letrahalloween">Jugaré, no abandonaré</p>
    
            <button id="playVideoButton">CONTINUAR</button>
        </div>

        <div id="videoContainer" class="hidden">
            <video id="video" width="640" height="360">
                <source src="video/video-parqueroblecilloOK.mp4" type="video/mp4">
                Tu navegador no soporta la reproducción de video.
            </video>
        </div>
  
        <div id="imageButtonContainer" class="hidden">
            <button id="showImageButton">PISTA</button>
        </div>

        <div id="imageContainer" class="hidden">
            <img id="image" src="img/halloween-parque-roblecillo.jpg" alt="Imagen">
            <a href="https://maps.app.goo.gl/5CmasZFvrBgj2xfs9"><button>UBICACIÓN</button></a>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
